name: Volute bootstrap (aarch64)

# 只为 Volute fork 生成新前缀（com.volute.app）的 bootstrap 归档。
# 用 build-bootstraps.sh 直接从本仓库源码构建，不需要先发布 apt 仓库。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get purge -y '^temurin-.*' '^dotnet-.*' '^ghc-.*' || true
          df -h /

      - name: Build bootstrap (aarch64)
        run: |
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures aarch64 2>&1 | tee build.log

      - name: Locate zip + verify prefix
        if: always()
        run: |
          echo "== 当前目录 =="; pwd; ls -la | head -20
          echo "== 容器内找 zip =="
          sudo docker exec termux-package-builder find / -maxdepth 6 -name 'bootstrap-aarch64*.zip' -printf '%p %s\n' 2>/dev/null || true
          echo "== 宿主机找 zip =="
          sudo find / -xdev -name 'bootstrap-aarch64*.zip' -printf '%p %s\n' 2>/dev/null | head -5 || true
          echo "== docker cp 兜底 =="
          sudo docker cp termux-package-builder:/home/builder/termux-packages/bootstrap-aarch64.zip . 2>/dev/null || echo "(docker cp 失败)"
          ls -la *.zip 2>/dev/null || echo "(宿主机根目录仍无 zip)"
          ZIP=$(find . -maxdepth 3 -name 'bootstrap-aarch64*.zip' | head -1)
          if [ -z "$ZIP" ]; then echo "!! 没找到 bootstrap zip"; exit 0; fi
          echo "ZIP=$ZIP"
          echo "== SYMLINKS.txt 前缀统计 =="
          unzip -p "$ZIP" SYMLINKS.txt > /tmp/sym.txt || true
          echo "volute hits: $(grep -c 'com\.volute\.app' /tmp/sym.txt || true)"
          echo "termux hits: $(grep -c 'com\.termux' /tmp/sym.txt || true)"
          echo "== bin/bash 二进制内前缀 =="
          unzip -p "$ZIP" bin/bash 2>/dev/null | strings | grep -c 'com\.volute\.app' || true

      - name: Upload bootstrap zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-aarch64-volute
          path: "**/bootstrap-*.zip"
          if-no-files-found: warn
